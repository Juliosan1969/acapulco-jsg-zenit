<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama de Arquitectura JSG ZENIT</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-container {
      margin-bottom: 20px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .canvas-wrapper {
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="btn-container">
    <button onclick="descargarPNG()">⬇ Descargar Diagrama en PNG (Fondo Blanco HD)</button>
  </div>

  <div class="canvas-wrapper">
    <svg id="svg-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
      <defs>
        <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
        </filter>

        <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 1 0 L 5 8 L 9 0 z" fill="#3b82f6" />
        </marker>

        <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1e40af" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0e7490" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b45309" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#047857" />
          <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#334155" />
        </linearGradient>
      </defs>

      <style>
        .title-main { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
        .subtitle-main { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 14px; fill: #64748b; }
        .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #2563eb; }
        .card-header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 15px; fill: #ffffff; }
        .item-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 13.5px; fill: #334155; }
        .item-subtext { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
        .bus-line { stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      </style>

      <!-- Fondo blanco -->
      <rect width="100%" height="100%" fill="#ffffff" />
      
      <!-- Cuadrícula sutil -->
      <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#f1f5f9" />
      </pattern>
      <rect width="100%" height="100%" fill="url(#grid-dots)" />

      <!-- ENCABEZADO -->
      <g transform="translate(60, 42)">
        <rect x="0" y="0" width="145" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="72" y="16" text-anchor="middle" class="badge-text">JSG ZENIT • SISTEMAS</text>
        <text x="0" y="54" class="title-main">Diagrama de Arquitectura Integral de Sistemas</text>
        <text x="0" y="76" class="subtitle-main">Plataforma Ciudadana 360°, Resiliencia Hidrometeorológica y Servicios Turísticos de Acapulco</text>
      </g>

      <!-- LÍNEAS DE FLUJO -->
      <path d="M 600, 200 L 600, 230" class="bus-line" marker-end="url(#arrow-down)" />
      <path d="M 600, 310 L 600, 345" class="bus-line" />
      <path d="M 230, 345 L 970, 345" class="bus-line" />
      <path d="M 230, 345 L 230, 375" class="bus-line" marker-end="url(#arrow-down)" />
      <path d="M 600, 345 L 600, 375" class="bus-line" marker-end="url(#arrow-down)" />
      <path d="M 970, 345 L 970, 375" class="bus-line" marker-end="url(#arrow-down)" />
      <path d="M 230, 605 L 230, 635" class="bus-line" />
      <path d="M 600, 605 L 600, 635" class="bus-line" />
      <path d="M 970, 605 L 970, 635" class="bus-line" />
      <path d="M 230, 635 L 970, 635" class="bus-line" />
      <path d="M 600, 635 L 600, 665" class="bus-line" marker-end="url(#arrow-down)" />

      <!-- 1. DISPOSITIVOS FINALES -->
      <g transform="translate(330, 130)" filter="url(#card-shadow)">
        <rect width="540" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <path d="M 0,12 Q 0,0 12,0 L 528,0 Q 540,0 540,12 L 540,32 L 0,32 Z" fill="url(#grad-slate)" />
        <text x="270" y="21" text-anchor="middle" class="card-header-title">DISPOSITIVOS FINALES</text>
        <g transform="translate(270, 52)">
          <circle cx="-145" cy="-1" r="5" fill="#3b82f6" />
          <text x="-132" y="3" class="item-text" font-weight="600">Android (APK / AAB)</text>
          
          <circle cx="8" cy="-1" r="5" fill="#06b6d4" />
          <text x="21" y="3" class="item-text" font-weight="600">iOS (Nativo)</text>
          
          <circle cx="115" cy="-1" r="5" fill="#10b981" />
          <text x="128" y="3" class="item-text" font-weight="600">Web PWA Ligera</text>
        </g>
      </g>

      <!-- 2. GATEWAY & CDN -->
      <g transform="translate(330, 230)" filter="url(#card-shadow)">
        <rect width="540" height="80" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
        <path d="M 0,12 Q 0,0 12,0 L 528,0 Q 540,0 540,12 L 540,34 L 0,34 Z" fill="url(#grad-blue)" />
        <text x="270" y="23" text-anchor="middle" class="card-header-title">GATEWAY y CDN (Cloudflare / Edge)</text>
        <text x="270" y="60" text-anchor="middle" class="item-text">
          <tspan font-weight="600">Caché perimetral</tspan> • Certificados SSL • Protección DDoS • Balanceo de Carga
        </text>
      </g>

      <!-- TARJETA 1: NÚCLEO SIG -->
      <g transform="translate(70, 375)" filter="url(#card-shadow)">
        <rect width="320" height="230" rx="12" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5" />
        <path d="M 0,12 Q 0,0 12,0 L 308,0 Q 320,0 320,12 L 320,44 L 0,44 Z" fill="url(#grad-cyan)" />
        <text x="160" y="28" text-anchor="middle" class="card-header-title">1. NÚCLEO SIG &amp; ARSET PIPELINE</text>
        <g transform="translate(24, 75)">
          <circle cx="6" cy="0" r="4" fill="#0891b2" />
          <text x="18" y="4" class="item-text" font-weight="600">Ingesta Satelital Abierta</text>
          <text x="18" y="20" class="item-subtext">NASA GPM (Lluvia), SMAP y Sentinel SAR</text>

          <circle cx="6" cy="46" r="4" fill="#0891b2" />
          <text x="18" y="50" class="item-text" font-weight="600">Modelos de Flujo y Cuencas</text>
          <text x="18" y="66" class="item-subtext">Camarón, La Sabana y Colector Costera</text>

          <circle cx="6" cy="92" r="4" fill="#0891b2" />
          <text x="18" y="96" class="item-text" font-weight="600">Geoserver y Vector Tiles</text>
          <text x="18" y="112" class="item-subtext">Capas ligeras (.pbf) de bajo consumo</text>
        </g>
      </g>

      <!-- TARJETA 2: MOTOR CIUDAD -->
      <g transform="translate(440, 375)" filter="url(#card-shadow)">
        <rect width="320" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <path d="M 0,12 Q 0,0 12,0 L 308,0 Q 320,0 320,12 L 320,44 L 0,44 Z" fill="url(#grad-blue)" />
        <text x="160" y="28" text-anchor="middle" class="card-header-title">2. MOTOR CIUDAD &amp; RUTEO</text>
        <g transform="translate(24, 75)">
          <circle cx="6" cy="0" r="4" fill="#2563eb" />
          <text x="18" y="4" class="item-text" font-weight="600">OSRM / Ruteo con Topografía</text>
          <text x="18" y="20" class="item-subtext">Desvío por escurrimiento o inundación</text>

          <circle cx="6" cy="46" r="4" fill="#2563eb" />
          <text x="18" y="50" class="item-text" font-weight="600">Directorio SOS y Resiliencia</text>
          <text x="18" y="66" class="item-subtext">Refugios, hospitales y rutas de desalojo</text>

          <circle cx="6" cy="92" r="4" fill="#2563eb" />
          <text x="18" y="96" class="item-text" font-weight="600">Geolocalización Dinámica</text>
          <text x="18" y="112" class="item-subtext">Avatar turista y matriz de proximidad</text>
        </g>
      </g>

      <!-- TARJETA 3: MONETIZACIÓN -->
      <g transform="translate(810, 375)" filter="url(#card-shadow)">
        <rect width="320" height="230" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
        <path d="M 0,12 Q 0,0 12,0 L 308,0 Q 320,0 320,12 L 320,44 L 0,44 Z" fill="url(#grad-amber)" />
        <text x="160" y="28" text-anchor="middle" class="card-header-title">3. MONETIZACIÓN &amp; PUBLICIDAD</text>
        <g transform="translate(24, 75)">
          <circle cx="6" cy="0" r="4" fill="#d97706" />
          <text x="18" y="4" class="item-text" font-weight="600">Directorio Pro Verificado</text>
          <text x="18" y="20" class="item-subtext">Médicos, guías turísticos y náuticos</text>

          <circle cx="6" cy="46" r="4" fill="#d97706" />
          <text x="18" y="50" class="item-text" font-weight="600">Banners Locales y Cupones</text>
          <text x="18" y="66" class="item-subtext">Publicidad no intrusiva geolocalizada</text>

          <circle cx="6" cy="92" r="4" fill="#d97706" />
          <text x="18" y="96" class="item-text" font-weight="600">Pasarela de Pagos Segura</text>
          <text x="18" y="112" class="item-subtext">Suscripciones para comercios (SPEI / Stripe)</text>
        </g>
      </g>

      <!-- 4. BASE DE DATOS ESPACIAL -->
      <g transform="translate(300, 665)" filter="url(#card-shadow)">
        <rect width="600" height="120" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.8" />
        <path d="M 0,14 Q 0,0 14,0 L 586,0 Q 600,0 600,14 L 600,38 L 0,38 Z" fill="url(#grad-emerald)" />
        <text x="300" y="25" text-anchor="middle" class="card-header-title">BASE DE DATOS ESPACIAL &amp; TIEMPO REAL</text>
        <text x="300" y="64" text-anchor="middle" class="item-text" font-weight="700" font-size="16px" fill="#065f46">
          Supabase (PostgreSQL + Motor Geoespacial PostGIS)
        </text>
        <g transform="translate(300, 95)">
          <rect x="-240" y="-12" width="220" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
          <text x="-130" y="4" text-anchor="middle" class="item-subtext" font-weight="600" fill="#166534">Índices GiST (Coordenadas / Rutas)</text>

          <rect x="20" y="-12" width="220" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
          <text x="130" y="4" text-anchor="middle" class="item-subtext" font-weight="600" fill="#166534">Almacenamiento Local (Offline Cache)</text>
        </g>
      </g>

      <!-- PIE -->
      <text x="600" y="830" text-anchor="middle" class="item-subtext" fill="#94a3b8">
        Diseño de Arquitectura de Sistemas • Plataforma Acapulco JSG ZENIT • Iniciativa Ciudadana de Resiliencia
      </text>
    </svg>
  </div>

  <script>
    function descargarPNG() {
      const svgElement = document.getElementById('svg-diagram');
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      // Escala 2x para nitidez HD en presentaciones
      const width = 1200;
      const height = 860;
      const scale = 2;

      canvas.width = width * scale;
      canvas.height = height * scale;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);

        const pngURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'Arquitectura_Sistemas_JSG_ZENIT.png';
        link.href = pngURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobURL);
      };

      img.src = blobURL;
    }
  </script>
</body>
</html>
